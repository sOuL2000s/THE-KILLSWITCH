# Create this file at: .github/workflows/release.yml

name: Build and Auto-Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build & Publish ProcessManagerApp
      run: dotnet publish ProcessManagerApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/ProcessManagerApp

    - name: Build & Publish KillSwitch-MiNi
      run: dotnet publish KillSwitch-MiNi/KillSwitch-MiNi.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/KillSwitch-MiNi

    - name: Prepare Release Assets
      shell: pwsh
      run: |
        Rename-Item -Path "./dist/ProcessManagerApp/ProcessManagerApp.exe" -NewName "TheKillSwitch.exe"
        Rename-Item -Path "./dist/KillSwitch-MiNi/KillSwitch-MiNi.exe" -NewName "TheKillSwitch-MiNi.exe"

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Automatic Build' }}
        files: |
          ./dist/ProcessManagerApp/TheKillSwitch.exe
          ./dist/KillSwitch-MiNi/TheKillSwitch-MiNi.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}